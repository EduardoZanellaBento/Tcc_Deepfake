# =============================================================================
# CONFIGURAÇÃO CENTRAL DO EXPERIMENTO
# Todo parâmetro metodológico mora aqui. Quando a banca perguntar "qual sample
# rate? quantos MFCCs? qual a semente?", a resposta está neste arquivo.
# Chaves que o código ainda não consome estão marcadas como
# "(declarativo — ainda não consumido pelo código)"; toda chave sem essa marca
# é lida por pelo menos um .py.
# =============================================================================

semente: 42          # reprodutibilidade: mesma semente => mesmos splits/resultados
                     # lida via src/utils (carregar_config + fixar_seeds) por
                     # split, treino e TODOS os scripts de diagnóstico.

dataset:
  nome: "ASVspoof2021_LA_eval"   # (declarativo — ainda não consumido pelo código)
  caminho_audios: "data/raw/ASVspoof2021_LA_eval/flac"
  caminho_chaves: "data/raw/keys/LA/CM/trial_metadata.txt"  # labels (bonafide/spoof)
  # DECIDIDO [aprovado pelo orientador] — universo do experimento.
  # fase == 'eval': 148.176 áudios, o conjunto oficialmente pontuado do
  # ASVspoof 2021 LA. O total bruto de 181.566 do labels.csv NÃO é o conjunto
  # eval: é eval (148.176) + progress (16.464) + hidden (16.926). 'progress' e
  # 'hidden' são EXCLUÍDOS por controle metodológico: o 'hidden' tem silêncio
  # pré-cortado na origem (trim == 'only_speech'), um pré-processamento
  # distinto do restante (notrim) que contamina qualquer análise de prop_fala.
  # Verificação: scripts/composicao_eval.py. Consumo: src/data/split.py lê esta
  # chave (o parâmetro `fase` de criar_split vira override pontual para
  # diagnósticos; se None, vale o config).
  fase: "eval"

# -----------------------------------------------------------------------------
# BRAÇO DUPLO DO EXPERIMENTO
# A subamostra é parâmetro DE EXPERIMENTO, não de modelo. O orientador foi
# explícito: "Essa mesma subamostra deve ser usada para treino e ajuste dos
# três pipelines, RF, SVM e CNN." Deixá-la sob modelos.svm convidaria a
# aplicá-la só ao SVM e destruiria a comparação — o coração do trabalho.
# -----------------------------------------------------------------------------
experimento:
  # DECIDIDO [aprovado pelo orientador] — por que DOIS braços:
  # a curva de aprendizado no universo eval (curva_aprendizado_rf_eval.json)
  # mostra que o RF NÃO satura antes do treino completo (f1_macro 0,4882 em
  # 20k -> 0,5573 em 103.723), logo a subamostra de 30k CUSTA desempenho real
  # e o braço de referência existe para quantificar esse custo.
  #   braco: "principal"  -> RF, SVM e CNN treinam na MESMA subamostra de ~30k
  #                          (mesmo ambiente experimental; comparação limpa —
  #                          exigência da pergunta de pesquisa).
  #   braco: "referencia" -> treino no conjunto completo de treino do eval
  #                          (103.723); quantifica quanto a subamostra custou.
  # Em AMBOS os braços, VALIDAÇÃO e TESTE permanecem COMPLETOS — exigência
  # textual do orientador. `braco` substitui o antigo booleano
  # `usar_subamostra`, que deixou de fazer sentido: os dois braços rodam,
  # não é liga/desliga.
  # Consumo: src/data/split.py (filtrar_treino_braco) — 'principal' filtra o
  # TREINO pelos IDs de `caminho_subamostra`, 'referencia' usa o treino
  # completo; validação e teste permanecem completos nos dois braços. O RF
  # (src/models/treinar_rf.py) roda os DOIS braços e salva artefatos com
  # sufixo _principal/_referencia; esta chave é o braço DEFAULT para quem
  # treina um braço só (o SVM, quando existir, roda somente no principal).
  braco: "principal"
  # As três chaves abaixo são lidas por scripts/gerar_subamostra.py:
  tamanho_subamostra: 30000   # alvo; o n final pode divergir por arredondamento
                              # (registrado em subamostra_30k.json, não maquiado)
  caminho_subamostra: "data/processed/subamostra_30k.csv"
  estratificacao_subamostra: ["classe_binaria", "codec", "ataque"]  # 98 estratos no eval

modelos:
  svm:
    # A subamostra de treino NÃO mora mais aqui — ela é compartilhada por RF,
    # SVM e CNN e virou parâmetro do bloco `experimento` (topo do arquivo).
    # A motivação (SVM-RBF é O(n²)–O(n³), inviável nos 103.723 de treino) está
    # documentada lá e em scripts/gerar_subamostra.py.

audio:
  sample_rate: 16000   # Hz. ASVspoof é 16kHz. Manter alto preserva artefatos de alta freq.
  # DECIDIDO [aprovado pelo orientador] — 4,0 s é FIXO. Testar outras durações
  # abriria um novo eixo experimental e consumiria tempo do TC II; o problema do
  # zero-padding é tratado pelo mascaramento da agregação (features.mascarar_padding),
  # não pela duração. Se necessário, a escolha da duração entra como LIMITAÇÃO ou
  # TRABALHO FUTURO no texto — nunca como experimento adicional agora.
  duracao_segundos: 4.0  # padroniza duração (corta/preenche). Janela fixa de entrada.
  vad: true            # remoção de silêncio (Voice Activity Detection)

features:                # parâmetros das características manuais (RF e SVM)
  # DECIDIDO [ratificado pelo orientador] — sem fmax=4000 global:
  # "Não limite as features a 4 kHz... Preserve a banda disponível e reporte
  # as métricas por codec." Justificativa pela composição do dataset (fonte:
  # results/metricas/eval_composicao_codec.csv — mesmos números do README):
  #   banda estreita (teto 4kHz): alaw, ulaw, gsm, pstn  -> 85.860 (57,9%)
  #   banda larga  (>4kHz):       g722, opus, none        -> 62.316 (42,1%)
  # Filtrar tudo em 4kHz destruiria sinal real em 42% dos dados, justamente a
  # banda alta onde vivem os artefatos de síntese. Métricas POR CODEC em
  # scripts/diagnostico_por_codec.py.
  # Estado atual: nenhum fmax é passado ao librosa — o MFCC usa o default
  # (fmax = sr/2 = 8000 Hz). O features.csv em disco foi extraído assim.
  #
  # ============================================================
  # ⚠️  LOTE ÚNICO DE RE-EXTRAÇÃO — EXECUTADO; features CONGELADAS
  # ============================================================
  # As quatro pendências foram APROVADAS pelo orientador, implementadas no
  # código (bloco 1, 25–27/08) e APLICADAS no features.csv pelo lote único de
  # re-extração em 30/08/2026 (dossiê: results/metricas/DOSSIE_LOTE_UNICO.md):
  #   1. [APLICADO no features.csv em 30/08/2026] win_length=400 no
  #      spectral_centroid — o CSV antigo usou o default (n_fft=512), dando ao
  #      centróide resolução temporal diferente da do MFCC/ZCR.
  #   2. [APLICADO no features.csv em 30/08/2026] filtro fase == 'eval' dentro
  #      de executar() — só o universo aprovado (148.176), não os 181.566.
  #   3. [APLICADO no features.csv em 30/08/2026] mascaramento de padding na
  #      agregação temporal (chave `mascarar_padding`, abaixo).
  #   4. [APLICADO no features.csv em 30/08/2026] n_frames_validos e
  #      n_frames_total como colunas de diagnóstico, FORA do X
  #      (COLUNAS_DIAGNOSTICO em extrair_features.py, consumida por
  #      colunas_features em src/data/split.py).
  # Evidência da checagem: results/metricas/checagem_mascaramento.json
  # (gerada por `python -m scripts.verificar_mascaramento`).
  # AS FEATURES ESTÃO CONGELADAS — nova re-extração só por erro grave, com
  # decisão registrada. A definição vigente está assinada em
  # data/features/features.meta.json, conferido pela guarda de retomada de
  # executar() (_validar_retomada em src/features/extrair_features.py).
  n_mfcc: 20           # nº de coeficientes MFCC
  n_fft: 512           # tamanho da FFT
  hop_length: 256      # passo entre janelas
  win_length: 400      # ~25ms a 16kHz — vale para MFCC, ZCR E centróide
  # DECIDIDO [aprovado pelo orientador] — mascaramento de padding:
  # a agregação (média/desvio) usa SOMENTE os frames cujo centro cai dentro do
  # áudio real pós-VAD; os zeros inseridos para fechar os 4,0 s não entram na
  # conta. Medido em checagem_mascaramento.json: a mediana é 121 frames válidos
  # de 251 — metade do tensor é padding, e incluí-lo desloca as features em 30%
  # (mediana) a 47% (máximo). Além disso a distorção é ASSIMÉTRICA entre as
  # classes (até |0,47| padronizado em mfcc1_std/centroide_std/mfcc5_media),
  # embora a FRAÇÃO de padding seja quase igual (44,8% bonafide vs 45,2% spoof)
  # — a assimetria vem do conteúdo acústico, não da quantidade de zeros.
  # Justificativa completa: docstring de src/features/extrair_features.py e
  # results/metricas/RECOMENDACAO_MASCARAMENTO.md (com o adendo de 26/08).
  # Consumo: _processar_um em src/features/extrair_features.py (default True se
  # a chave sumir — config incompleto não reverte decisão metodológica).
  # false existe apenas para reproduzir o CSV antigo em comparações A/B.
  mascarar_padding: true
  # Por áudio guardamos média + desvio-padrão de cada feature ao longo do tempo,
  # transformando uma série temporal num vetor de tamanho fixo (entrada tabular).
  agregacao: ["media", "desvio_padrao"]  # (declarativo — ainda não consumido pelo código)

espectrograma:           # entrada da CNN — (declarativo — ainda não consumido
  tipo: "mel"            #  pelo código: a CNN ainda não foi implementada)
  n_mels: 128
  altura: 128          # dimensões da "imagem" que entra na CNN
  largura: 256

split:
  # DECIDIDO [aprovado pelo orientador] — split aleatório por utterance mantido
  # como baseline, com LIMITAÇÃO DECLARADA (mesmo texto do README):
  # cada ataque (A07–A19), codec e locutor aparece em treino E teste, logo o
  # modelo pode memorizar a assinatura de um vocoder/locutor específico e as
  # métricas são potencialmente OTIMISTAS e NÃO comparáveis ao EER de 1,32% de
  # Yamagishi et al. (2022), cujo protocolo é deliberadamente cross-attack.
  # Mitigação: métricas por ataque (diagnostico_por_ataque.py) e por codec
  # (diagnostico_por_codec.py). Robustez (split por ataque /
  # leave-one-attack-out) prevista como ANÁLISE COMPLEMENTAR, após fechar
  # RF, SVM e CNN.
  treino: 0.70
  validacao: 0.15
  teste: 0.15
  estratificado: true  # mantém proporção real/sintético em cada subconjunto
                       # (declarativo — o stratify é fixo em src/data/split.py)

validacao_cruzada:       # (declarativo — consumido na fase de ajuste, semana 7)
  tipo: "stratified_kfold"
  n_folds: 5

desbalanceamento:        # (declarativo — treinar_rf.py fixa class_weight='balanced')
  estrategia: "class_weights"   # penaliza mais o erro na classe minoritária (real)

tuning:
  metodo: "random_search"   # mais eficiente que grid search em espaços grandes
  n_iter: 30
  # TODO [OBRIGATÓRIO no espaço de busca — ver results/metricas/NOTA_LIMIAR.md]
  # 1. min_samples_leaf entre 5 e 20: com max_depth=None as folhas ficam puras e
  #    o class_weight='balanced' é neutralizado no predict_proba (o peso muda os
  #    splits, mas a probabilidade de folha pura é 1,0 independentemente dele).
  # 2. class_weight='balanced_subsample' como alternativa ao 'balanced'.
  # 3. SELEÇÃO DE LIMIAR NA VALIDAÇÃO (max f1_macro ou limiar do EER) como REGRA
  #    DE PROTOCOLO para RF, SVM e CNN igualmente — decisão por score >= limiar
  #    (convenção de empate registrada em nota_divergencia_f1.md). Sem isso, a
  #    comparação central do trabalho fica enviesada pelo limiar fixo 0,50.
  # NÃO alterar valores agora — itens entram na fase de ajuste (semana 7).

metricas:                # (declarativo — treinar_rf.py calcula esta lista, sem lê-la)
  - acuracia
  - precisao
  - recall
  - f1
  - eer                # Equal Error Rate — métrica padrão da literatura ASVspoof
  - tempo_inferencia   # viabilidade computacional (diferencial do trabalho)

# =============================================================================
# DECISÃO METODOLÓGICA - protocolo de medição de tempo
# =============================================================================
# PROBLEMA: RF e SVM rodam em CPU; a CNN roda em GPU (RTX 5060 Ti 16GB, sm_120).
# Comparar 0,0017 ms/áudio de RF em CPU com uma CNN em GPU não é justo em nenhuma
# direção: medir tudo em CPU penaliza artificialmente a CNN, e medir cada um no
# seu hardware natural compara MÁQUINAS, não MODELOS.
#
# DECISÃO: reportar quatro medições.
#   (1) RF   — CPU
#   (2) SVM  — CPU
#   (3) CNN  — GPU  (melhor caso, hardware dedicado)
#   (4) CNN  — CPU  (hardware modesto, sem GPU)
#
# JUSTIFICATIVA: a vantagem dos modelos clássicos, na pergunta de pesquisa, não é
# serem mais rápidos em igualdade de hardware — é NÃO EXIGIREM GPU. O par (3)/(4)
# é o único arranjo que evidencia isso.
#
# REGRAS DE MEDIÇÃO (a serem implementadas quando o módulo de tempo for escrito):
#   - descartar as primeiras execuções (inicialização do contexto CUDA, carga de
#     kernels e autotune do cuDNN podem tornar a 1ª inferência 100x mais lenta);
#   - SEMPRE chamar torch.cuda.synchronize() ANTES e DEPOIS do trecho cronometrado
#     (CUDA é assíncrono: sem isso, mede-se o tempo de ENFILEIRAR, não de executar,
#     e a CNN parece milhares de vezes mais rápida do que é);
#   - medir latência (batch=1, cenário de uso real) E throughput (lote) separadamente;
#   - fixar n_jobs igual para todos os modelos clássicos e declarar qual foi;
#   - reportar mediana de N execuções + mínimo e máximo, nunca medição única;
#   - registrar hardware e versões no JSON de resultados, como já é feito em
#     results/metricas/curva_aprendizado_rf.json.
#
# incluir_extracao_features: medir também o pipeline COMPLETO (carregar + VAD +
#   extrair features/gerar espectrograma + predizer), e não só o predict. O
#   predict do RF leva 0,0017 ms; a extração com librosa leva ordens de grandeza
#   mais. A hipótese é que o pré-processamento DOMINE o custo nos três modelos,
#   tornando a escolha do classificador quase irrelevante para o tempo de
#   inferência real. Se confirmado, é um achado de engenharia relevante para o TC II.
# =============================================================================
tempo:
  cenarios: ["cpu", "gpu"]
  repeticoes: 10
  descartar_aquecimento: 3
  medir_latencia: true        # batch = 1
  medir_throughput: true      # lote
  incluir_extracao_features: true
